apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-timestamp
  labels:
    app: nginx-timestamp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-timestamp
  template:
    metadata:
      labels:
        app: nginx-timestamp
    spec:
      shareProcessNamespace: true
      restartPolicy: Always

      initContainers:
        - name: init-done
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - echo "init failed"; exit 1

      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          command: ["/bin/sh", "-c"]
          args:
            - |
              TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
              echo "hello in MLOPS MENA COMMUNITY : $TIMESTAMP" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'

        - name: time-updater
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              NGINX_PID=""
              while true; do
                if [ -z "$NGINX_PID" ]; then
                  NGINX_PID=$(pgrep -f "nginx: master" | head -n 1)
                fi

                if [ -n "$NGINX_PID" ] && [ -d "/proc/$NGINX_PID/root" ]; then
                  TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
                  echo "hello in MLOPS MENA COMMUNITY : $TIMESTAMP" \
                    > "/proc/$NGINX_PID/root/usr/share/nginx/html/index.html"
                fi

                sleep 5
              done
