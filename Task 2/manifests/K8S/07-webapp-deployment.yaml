apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-api
  namespace: task2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp-api
  template:
    metadata:
      labels:
        app: webapp-api
    spec:
      containers:
        - name: webapp-api
          image: abeer/fastapi-guestbook:1.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: webapp-config
          env:
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
          readinessProbe:
            httpGet:
              path: /api/info
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
